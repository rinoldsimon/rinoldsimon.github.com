<div class="social-row{% if include.compact %} social-row--compact{% endif %}">
  <a href="{{ site.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
    <svg><use href="#icon-github"></use></svg>
  </a>
  <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
    <svg><use href="#icon-linkedin"></use></svg>
  </a>
  <a href="{{ site.x }}" target="_blank" rel="noopener noreferrer" aria-label="X">
    <svg><use href="#icon-x"></use></svg>
  </a>
  <a href="{{ site.stackoverflow }}" target="_blank" rel="noopener noreferrer" aria-label="Stack Overflow">
    <svg><use href="#icon-stackoverflow"></use></svg>
  </a>
  <a href="{{ site.wordpress }}" target="_blank" rel="noopener noreferrer" aria-label="Tech blog">
    <svg><use href="#icon-wordpress"></use></svg>
  </a>
</div>
